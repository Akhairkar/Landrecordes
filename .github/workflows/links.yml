name: Official link health

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # commits data/link-status.json (owner-approved batch 1, 2026-10-31)

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check portal and source links (non-blocking report)
        run: node scripts/check-links.mjs --write
      # Results from GitHub's network replace checks run elsewhere. State pages show only successful checks.
      - name: Commit link status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-status.json
          git diff --cached --quiet || { git commit -m "data: weekly official link check" && git push; }
