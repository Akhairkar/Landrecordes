name: CI — tests and quality gates

on:
  push:
    branches-ignore: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Build + quality gates (BUILD_RULES §A)
        run: node scripts/build.mjs
      - name: Install dev dependencies (accessibility check only)
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe, light and dark)
        run: node scripts/a11y.mjs
